<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- CSP: só scripts do próprio site + o trecho anti-quadro abaixo (identificado pelo hash; se mudar o trecho, recalcule) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-S0iMGF0PPfuvokXRzUhsFfM+OAIN9HhV7gzBBlQJCOc='; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src https://sinadiga-api.sinadiga.workers.dev; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SINADIGA - Administração</title>
<!-- Anti-clickjacking: a página fica invisível e só aparece se NÃO estiver dentro de um quadro de outro site.
     A hospedagem não permite cabeçalhos (X-Frame-Options/CSP); se o quadro bloquear a navegação (sandbox), a página continua oculta. -->
<style id="antiquadro">html{display:none !important}</style>
<script>
if (self === top) document.getElementById("antiquadro").remove();
else { try { top.location = self.location; } catch (e) { /* bloqueado: continua oculta */ } }
</script>
<link rel="stylesheet" href="estilo.css?v=9">
</head>
<body>

<div id="topo"><b>SINADIGA</b> &nbsp;|&nbsp; Administração de cadastros</div>
<nav><a href="index.html">Início</a><a href="cadastro.html">Cadastro de Gatos</a><a class="on">Administração</a></nav>

<main>
  <h1>Moderação de cadastros</h1>
  <form id="login">
    <label for="token">Senha de administrador:</label>
    <input type="password" id="token" autocomplete="current-password" required>
    <div class="btns"><button>Entrar</button></div>
  </form>
  <div id="msg" hidden></div>
  <div id="painel" hidden>
    <div id="alerta" class="alerta" hidden role="status" aria-live="polite"></div>
    <p class="desc" style="margin:0 0 6px">Atualiza sozinho a cada minuto. Última atualização: <b id="hora">-</b>
      &nbsp;<button type="button" id="atualizar">Atualizar agora</button>
      &nbsp;<button type="button" id="testeTg">Enviar teste ao Telegram</button>
      &nbsp;<button type="button" id="relTg">Enviar relatório de hoje</button></p>
    <h1 style="margin-top:20px">Aguardando aprovação</h1>
    <div id="pendentes"></div>
    <h1 style="margin-top:24px">Aprovados</h1>
    <div id="aprovados"></div>
    <div class="btns"><button id="sair">Sair</button></div>
  </div>
</main>

<script src="config.js?v=8"></script>
<script src="gatos.js?v=8"></script>
<script src="admin.js?v=2"></script>
</body>
</html>
