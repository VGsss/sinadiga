name = "sinadiga-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "sinadiga"
database_id = "83a7d5ed-5978-4638-ae3c-ad02d8e1072d"

[vars]
# sites autorizados a chamar a API pelo navegador (CORS). Em desenvolvimento, o localhost é liberado só no arquivo api/.dev.vars (nunca vai para produção)
ALLOWED_ORIGINS = "https://sinadiga.com.br,https://www.sinadiga.com.br,https://vgsss.github.io"
# endereço do painel, incluído na mensagem do Telegram
ADMIN_URL = "https://sinadiga.com.br/admin.html"

# 06:17 UTC: limpeza diária (apaga anúncios com mais de 30 dias). 23:00 UTC (20:00 em Brasília): relatório de visitas do dia no Telegram
[triggers]
crons = ["17 6 * * *", "0 23 * * *"]
